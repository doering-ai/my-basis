###################
### I. METADATA ###
###################
[project]
name = "mysublime-basis"
version = "0.1.0"
description = "A basis for using, extending, and designing SublimeText plugins."
requires-python = "==3.8.*"
urls = { Homepage = "https://gitlab.com/doering-thinking-machines/libs/sublime/basis" }


########################
### II. DEPENDENCIES ###
########################
dependencies = [
    "more-itertools>=10.5.0",
    "pydantic>=2.10.6",
    "regex>=2024.11.6",
]

[dependency-groups]
dev = [
    "ruff>=0.14.14",
    "ty>=0.0.14",
    "sublime-stubs",
    "types-regex>=2024.11.6.20241221",
]


#########################
### III. BUILD SYSTEM ###
#########################
[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mySublimeBasis"
module-root = ""
namespace = true

[tool.uv.sources]
sublime-stubs = { path = "../_stubs", editable = true }

[tool.ruff]
target-version = "py38"