# Guided overall by https://docs.astral.sh/uv/guides/integration/gitlab/
# Modeled on the sibling `test` repo's pipeline (../test/.gitlab-ci.yml).
############
### HEAD ###
############
stages:
  - test
  - eval

# Import static analysis tools
include:
  - template: Security/Secret-Detection.gitlab-ci.yml
  - component: gitlab.com/gitlab-org/professional-services-automation/tools/utilities/pipeintel/pipeintel@1.0.0
    inputs:
      stage: eval
      offline: true

# Only run the pipeline for non-draft commits in a Merge Request or directly onto the main branch.
workflow:
  rules:
    - if: '$CI_COMMIT_TITLE =~ /-draft$/ || $CI_MERGE_REQUEST_DRAFT == "true"'
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

############
### DATA ###
############
variables:
  PACKAGE: myBasis
  # basis has no Containerfile of its own; jobs run inside the shared Sublime test-harness
  # image built and pushed by the sibling `test` project (ST runtime + task + uv).
  MAIN_POD: registry.gitlab.com/doering-ai/sublime/pytest:latest
  SECRET_DETECTION_ENABLED: 'true'
  UV_CACHE_DIR: .uv-cache
  USER: my

cache:
  key:
    files:
      - uv.lock
  paths:
    - $UV_CACHE_DIR

############
### BODY ###
############
default:
  image:
    name: $MAIN_POD
    entrypoint: [""]

secret_detection:
  stage: eval
  cache: []

test-plugin:
  stage: test
  before_script:
    - cd $CI_PROJECT_DIR
    - uv sync --all-extras
  script:
    - uv run pytest
  rules:
    - changes:
        - '**/*.py'

Evaluate Python:
  stage: eval
  before_script:
    - cd $CI_PROJECT_DIR
    - uv sync --all-extras
  interruptible: true
  script:
    - uv run ruff check --output-format=gitlab --output-file=code-quality-report.json
    - uv run pyrefly check
  artifacts:
    reports:
      codequality: $CI_PROJECT_DIR/code-quality-report.json
