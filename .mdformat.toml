# Shared defaults: ~/.config/myform/.mdformat.toml. Explicit local overrides follow.
#: Paragraph word wrap mode

#: apply consecutive numbering to ordered lists

#: output file line ending mode (default: lf)

#: Validate that the rendered HTML is consistent

#: Enabled extensions (default: all installed)
# extensions = [
#     "gfm",
#     "toc",
# ]

#: Enabled code formatter languages (default: all installed)
# codeformatters = [
#     "python",
#     "json",
# ]

# ---- Python 3.13+ Only ----
#: options: a list of file path pattern strings
exclude = [
    "**/syntax_test_*",
    "**/myst-mdformat/README.md",
    "**/myst-mdformat/docs/**",
    "stash/skill-normalization-ideas.md",
    # Test fixtures often contain dialect syntax that must survive formatting.
    "tests/data/**",
    "tests/fixtures/**",
    "**/fixtures/**",
    "**/*.fixture.md",
]

#: myst-mdformat plugin options ([plugin.myst] must follow all top-level keys)
[plugin.myst]
# periods (e.g., i.e., pp., ch., initials). Opt in manually per invocation with
# `mdformat --sembr <file>`; `--no-sembr` overrides an enabled TOML key.
