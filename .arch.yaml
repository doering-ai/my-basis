indexing:
    default: off
    insertion: observed

header_defaults:
    markdown: markdown
    source: source
    typst: off
    rst: off
    unknown: off

ignore:
    - '.git/**'
    - '.venv/**'
    - 'node_modules/**'
    - '__pycache__/**'
    - 'dist/**'
    - 'docs/_build/**'
    - '*.egg-info/**'
    - '.ruff_cache/**'
    - '.pytest_cache/**'
    - '.hypothesis/**'
    - '.coverage'
    - '*.lock'
    - '.task/**'
    - '.claude/**'
    - '.factory/**'
    - 'RELEASE-READINESS.md'
