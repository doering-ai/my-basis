###################
### I. METADATA ###
###################
[project]
name = "sublime-basis"
version = "0.7.0"
description = "A basis for using, extending, and designing SublimeText plugins."
requires-python = ">=3.13"
urls = { Homepage = "https://gitlab.com/doering-ai/libs/sublime/basis" }
authors = [{ name = "Robb Doering", email = "robb@doering.ai" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Framework :: Pydantic :: 2",
  "Topic :: Text Editors :: Integrated Development Environments (IDE)",
  "Topic :: Text Processing :: Markup :: Markdown",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
  "Typing :: Typed",
]


########################
### II. DEPENDENCIES ###
########################
dependencies = [
  "my-basis @ git+https://gitlab.com/doering-ai/libs/basis.git@9b33c09991ccdb62afce0ed06bf2299a07e7c9ed",
  "jinja2>=3.1.6",
  "more-itertools>=10.5.0",
  "pydantic>=2.10.6",
  "regex>=2024.11.6",
  "ruamel-yaml>=0.19.1",
  "sublime-lib",
  "sublime-aio",
  "toml>=0.10.2",
  "anyio>=4.5.2",
]

[dependency-groups]
dev = [
  { include-group = "eval" },
  { include-group = "test" },
]

eval = [
  "annotated-types>=0.7.0",
  "ruff>=0.14.14",
  "sublime-stubs",
  "pyrefly>=0.61.0",
  "types-regex>=2024.11.6.20241221",
  "typing-extensions>=4.13.2",
]

test = ["pytest>=8.3.5", "coverage>=7.6.1"]


#########################
### III. BUILD SYSTEM ###
#########################
[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"
[tool.uv.build-backend]
module-name = "myBasis"
module-root = ""
namespace = true

[tool.uv.sources]
sublime-stubs = { path = "../.pkgs/sublime-stubs" }
sublime-lib = { url = "https://github.com/SublimeText/sublime_lib/releases/download/v2.1.0/sublime_lib-2.1.0-py3-none-any.whl" }
sublime-aio = { url = "https://github.com/packagecontrol/sublime_aio/releases/download/v0.1.6/sublime_aio-0.1.6-py3-none-any.whl" }

[project.scripts]
setup-sublime = "myBasis.infra.setup_sublime:main"

#############################
### IV. DEVELOPMENT TOOLS ###
#############################
# -------
# Testing
# -------
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.report]
# Regexes for lines to exclude from consideration
exclude_also = [
  'def __repr__',
  'if[- \w.]+\b(?i:debug):',
  'assert ',
  'raise (Assertion|NotImplemented)Error',
  'if 0:',
  'if __name__ == .__main__.:',
  '@(abc\.)?abstractmethod',
  '^([a-z]\w+?\.)?[A-Z][_A-Z]+(:[^=\n]+)? *=[^\n]+(?=\n\S)',
]
ignore_errors = true

# ------
# Typing
# ------
[tool.pyrefly]
min-severity = 'warn'
python-version = '3.13'
check-unannotated-defs = true
permissive-ignores = true
search-path = ['.']

[tool.pyrefly.errors]
untyped-import = false
missing-source = false
implicit-any = false
unannotated-parameter = false
no-access = 'error'
unused-ignore = 'error'
unannotated-attribute = 'error'

# -------
# Linting
# -------
[tool.ruff]
indent-width = 4
line-length = 100

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
select = [
  "A",     # builtins
  "ASYNC", # async
  "B",     # bugbear
  "C4",    # comprehensions
  "D",     # PyDocStyle
  "E",     # PyCodeStyle errors
  "F",     # PyFlakes
  "FA",    # annotations
  "FAST",  # FastAPI
  "ISC",   # implicit-str-concat
  "N",     # Naming
  "TC",    # type checking
  "NPY",   # numpy
  "PIE",   # misc.
  "PLE",   # PyLint errors
  "PTH",   # use pathlib
  "PERF",  # performance
  "PT",    # pytest
  "PD",    # pandas
  "RUF",   # ruff
  "SIM",   # simplification
]

ignore = [
  # Bugbear
  "B009",
  "B905",

  # Comprehensions
  "C408",
  "C413",

  # PyCodeStyle
  "E266",
  "E731", # allow lambdas

  # Naming
  "N999",

  # PyLint errors
  "PT013",
  "PT018",

  # Ruff
  "RUF022",

  # Simplify
  "SIM102", # combine nested ifs
  "SIM114", # combine if branches
  "SIM118",

  # Type Checking -- these imports are evaluated by Pydantic or the live Sublime host.
  "TC001",
  "TC002",
  "TC003",

  # PyDocStyle
  "D100", # docstrings for modules
  "D104", # docstrings for packages 
  "D105", # docstrings for magic methods 
  "D410", # blank line after docstring sections
  "D411", # blank line before docstring sections

]

[tool.ruff.lint.per-file-ignores]
'test_*.py' = ['D']
'*_test.py' = ['D']

[tool.ruff.lint.flake8-pytest-style]
parametrize-names-type = "csv"

[tool.ruff.lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = true

[tool.ruff.lint.pydocstyle]
convention = "google"
