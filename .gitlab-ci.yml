# Guided overall by https://docs.astral.sh/uv/guides/integration/gitlab/
# Modeled on the sibling `test` repo's pipeline (../test/.gitlab-ci.yml).
#########################
### I. CONTROL BLOCKS ###
#########################
variables:
    PACKAGE: myBasis
    # basis has no Containerfile of its own; jobs run inside the shared Sublime test-harness
    # image built and pushed by the sibling `test` project (ST runtime + task + uv).
    MAIN_IMAGE: registry.gitlab.com/doering-ai/sublime/mytest:latest
    SECRET_DETECTION_ENABLED: 'true'

include:
    - template: Security/Secret-Detection.gitlab-ci.yml
    - component: gitlab.com/gitlab-org/professional-services-automation/tools/utilities/pipeintel/pipeintel@1.0.0
      inputs:
        stage: eval
        offline: true

# ---- Lifecyle ----
# These will be executed in turn, corresponding to one or more jobs below
stages:
    - test
    - eval

# Only run the pipeline for non-draft commits in a Merge Request or directly onto the main branch.
workflow:
    rules:
        - if: '$CI_COMMIT_TITLE =~ /-draft$/ || $CI_MERGE_REQUEST_DRAFT == "true"'
          when: never
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

#####################
### II. TEMPLATES ###
#####################
.uv:
    # This job is never directly executed, but serves as a template for all UV-based jobs.
    # From https://docs.astral.sh/uv/guides/integration/docker/#available-images
    image: $MAIN_IMAGE

