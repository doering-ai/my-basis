# Guided overall by https://docs.astral.sh/uv/guides/integration/gitlab/
# Modeled on the sibling `test` repo's pipeline (../test/.gitlab-ci.yml).
############
### HEAD ###
############
stages:
  - test
  - eval

# Import static analysis tools
include:
  - template: Security/Secret-Detection.gitlab-ci.yml
  - component: gitlab.com/gitlab-org/professional-services-automation/tools/utilities/pipeintel/pipeintel@1.0.0
    inputs:
      stage: eval
      offline: true

# Only run the pipeline for non-draft commits in a Merge Request or directly onto the main branch.
workflow:
  rules:
    - if: '$CI_COMMIT_TITLE =~ /-draft$/ || $CI_MERGE_REQUEST_DRAFT == "true"'
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

############
### DATA ###
############
variables:
  PACKAGE: myBasis
  PYTHON_VERSION: '3.14'
  SECRET_DETECTION_ENABLED: 'true'
  UV_CACHE_DIR: .uv-cache
  USER: my

cache:
  key:
    files:
      - uv.lock
  paths:
    - $UV_CACHE_DIR

############
### BODY ###
############
default:
  image:
    name: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
    entrypoint: [""]

secret_detection:
  stage: eval
  cache: []

.python:
  before_script:
    - cd "$CI_PROJECT_DIR"
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git
    - uv sync --frozen --no-default-groups --group test --python "$PYTHON_VERSION"

test-plugin:
  extends: .python
  stage: test
  parallel:
    matrix:
      - PYTHON_VERSION: ['3.13', '3.14']
  script:
    - mkdir -p /tmp/myBasis-mock/home/Packages
      '/tmp/myBasis-mock/home/Installed Packages'
    - uv run --no-sync pytest -q

Evaluate Python:
  extends: .python
  stage: eval
  interruptible: true
  script:
    - uvx ruff check --no-cache .
    - uvx ruff check --no-cache --output-format=gitlab --output-file=code-quality-report.json .
    - uvx ruff format --diff .
    - site_packages=$(.venv/bin/python -c
      'import sysconfig; print(sysconfig.get_path("purelib"))')
    - test -d "$site_packages"
    - api_path=$(mktemp -d)
    - cp "$CI_PROJECT_DIR/myBasis/infra/mock/_sublime.py" "$api_path/sublime.py"
    - cp "$CI_PROJECT_DIR/myBasis/infra/mock/_sublime_plugin.py" "$api_path/sublime_plugin.py"
    - cp "$CI_PROJECT_DIR/myBasis/infra/mock/_unittesting.py" "$api_path/unittesting.py"
    - >-
      uvx --with types-regex pyrefly check
      --config "$CI_PROJECT_DIR/pyproject.toml"
      --python-interpreter-path "$CI_PROJECT_DIR/.venv/bin/python"
      --site-package-path "$site_packages"
      --search-path "$CI_PROJECT_DIR" --search-path "$api_path"
      "$CI_PROJECT_DIR/myBasis" "$CI_PROJECT_DIR/tests"
  artifacts:
    reports:
      codequality: $CI_PROJECT_DIR/code-quality-report.json
