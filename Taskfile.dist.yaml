# yaml-language-server: $schema=https://taskfile.dev/schema.json
# Generated by copier from corpus taskfiles; any changes here must be merged.

version: '3'

vars:
    _0: '{{.TASK_DIR}}'
    UV: uv --project {{._0}}
    REPO_YAML:
        sh: cat {{._0}}/.repo.yaml 2>/dev/null || echo {}
    REPO:
        ref: fromYaml .REPO_YAML
    _PACKAGE: '{{get .REPO "package"}}'
    SRC_DIR: '{{._0}}/{{._PACKAGE}}'
    DOC_DIR: '{{._0}}/docs'
    DOC_OUT: '{{.DOC_DIR}}/_build'

tasks:

    sync:
        cmd: '{{.UV}} sync --all-extras {{.CLI_ARGS}}'
        aliases: [install, setup]
        desc: Install & verify dependencies through `uv sync`, including all optional and dev
            dependencies.

    # ----------
    # Evaluation
    # ----------
    eval:
        desc: Statically assess the codebase without applying formatting.
        deps:
            - eval:lint
            - eval:typecheck
            - eval:format

    eval:lint:
        cmd: '{{.UV}} run ruff check {{.CLI_ARGS}}'
        desc: Catch logic & semantic errors with `ruff check`.
        aliases: [ch, ruff, check]

    eval:typecheck:
        cmd: '{{.UV}} run pyrefly check {{.CLI_ARGS}}'
        desc: Verify types and import structure with `pyrefly check`.
        aliases: [ty, types]

    eval:format:
        cmd: '{{.UV}} run ruff format {{.CLI_ARGS}}'
        desc: Fix any formatting issues in our python code, saving the files in place with changes.
        aliases: [fm, fmt, format]

    # -------------
    # Sublime Tests
    # -------------
    test:
        cmd: '{{.UV}} run test-plugin {{.CLI_ARGS}}'
        desc: Execute `pytest` within a Sublime Text instance, proxying the output to the terminal.
        aliases: [tests, pytest, test-plugin]

    test:dev:
        cmd: '{{.UV}} run test-plugin --sw -vv {{.CLI_ARGS}}'
        aliases: [dev-test]
        desc: Run dev tests within a Sublime Text instance, showing extra output and skipping
            code coverage.

    test:ssu:
        cmd: '{{.UV}} run test-plugin --snapshot-update {{.CLI_ARGS}}'
        aliases: [snapshot-test]
        desc: Update regression test "snapshot" files to reflect new changes within a Sublime
            Text instance.

    test:cov:
        cmd: >-
            {{.UV}} run test-plugin
                --cov {{._PACKAGE}} --cov-report term-missing
                --cov-report markdown:tests/coverage.md {{.CLI_ARGS}}
        desc: Report code coverage of our unit tests to stdout and `tests/coverage.md` within
            a Sublime Text instance.

    # -------------
    # Documentation
    # -------------
    docs:
        desc: Run the full documentation pipeline.
        aliases: [sphinx]
        cmds:
            - task: docs:sync
            - task: docs:build

    docs:sync:
        desc: Update generated docs from source code.
        aliases: [sync-docs, sphinx-sync]
        cmd: '{{.UV}} run sync-docs {{.CLI_ARGS}}'
        sources: ['{{.SRC_DIR}}/**/*.py']
        generates: ['{{.DOC_DIR}}/*.md']

    docs:build:
        desc: Build the MyST docs into finalized webpages.
        aliases: [build-docs]
        cmd: >-
            {{.UV}} run sphinx-build --fail-on-warning --nitpicky {{.CLI_ARGS}}
            {{.DOC_DIR}} {{.DOC_OUT}}
        sources:
            - '{{.DOC_DIR}}/**/*.md'
            - '{{.DOC_DIR}}/conf.py'
        generates: ['{{.DOC_OUT}}/*']

    docs:clean:
        desc: Remove all generated documentation files.
        aliases: [clean-docs, sphinx-clean]
        cmd: rm -rf {{.DOC_OUT}}/*

    docs:publish:
        desc: Publish finalized Sphinx artifacts to ReadTheDocs.
        aliases: [publish-docs, readthedocs]
        cmd: echo "docs:publish not yet implemented..."
        preconditions: ['false']
