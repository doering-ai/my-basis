# yaml-language-server: $schema=https://taskfile.dev/schema.json
# Generated by copier from corpus taskfiles; any changes here must be merged.

version: '3'

vars:
    _0: '{{.TASK_DIR}}'
    GIT_REMOTE: '{{.GIT_REMOTE | default "origin"}}'
    CORPUS: '{{.MY_CORPUS | default "~/my/corpus"}}'
    AWT: uv run --project {{.CORPUS}} agent-worktree --repo {{._0}}
    UV: uv --project {{._0}}
    REPO_YAML:
        sh: cat {{._0}}/.repo.yaml 2>/dev/null || echo {}
    REPO:
        ref: fromYaml .REPO_YAML
    WORKRUN: ${MY_CORPUS:-$HOME/my/corpus}/scripts/workrun
    _PACKAGE_DEFAULT: '{{get .REPO "package"}}'
    _PACKAGE: '{{get .REPO "package"}}'
    _SUBPACKAGES:
        ref: get .REPO "subpackages" | default (dict)
    SRC_DIR: '{{._0}}/{{._PACKAGE}}'
    AUTODOC_SOURCE_GLOB: '{{._0}}/{{"{"}}{{._PACKAGE}},{{._PACKAGE}}{{range $_, $path := ._SUBPACKAGES}},{{$path}}{{end}}{{"}"}}/**/*.py'
    DOC_DIR: '{{._0}}/docs'
    DOC_OUT: '{{.DOC_DIR}}/_build'
    OP: podman
    IMG_FILE: Containerfile
    IMG_URL: registry.{{get .REPO "host"}}/{{get .REPO "host_path_full_"}}
    IMG: '{{.IMG_URL}}:latest'

tasks:
    # -----------
    # Moving Tags
    # -----------
    # Core parameterizable task — moves an annotated tag to HEAD and force-pushes.
    # Usage:
    #   task tag:move -- TAG=stable
    #   task tag:move -- TAG=dev MSG="Development snapshot"
    tag:move:
        desc: >-
            Move an annotated git tag to HEAD and force-push it.  Pass
            `TAG=<name>` and optional `MSG=<message>`.
        vars:
            TAG: '{{.TAG | default "stable"}}'
            _HASH:
                sh: git -C {{._0}} rev-parse --short HEAD 2>/dev/null || echo ""
            _MSG: '{{.MSG | default (printf "%s @ %s" .TAG ._HASH)}}'
        preconditions:
            - sh: git -C {{._0}} rev-parse --git-dir > /dev/null 2>&1
              msg: Not inside a git repository.
        prompt: 'Move `{{.TAG}}` tag to HEAD and force-push to `{{.GIT_REMOTE}}`?'
        cmds:
            - cmd: >-
                  git -C {{._0}} tag -f -a '{{.TAG}}' HEAD
                  -m '{{._MSG}}'
            - cmd: git -C {{._0}} push '{{.GIT_REMOTE}}' '{{.TAG}}' --force

    # Convenience aliases for industry-standard moving tags.
    tag:stable:
        desc: Move the `stable` annotated tag to HEAD and force-push.
        cmds:
            - task: tag:move
              vars: { TAG: stable }

    tag:dev:
        desc: Move the `dev` annotated tag to HEAD and force-push.
        cmds:
            - task: tag:move
              vars: { TAG: dev }

    tag:latest:
        desc: Move the `latest` annotated tag to HEAD and force-push.
        cmds:
            - task: tag:move
              vars: { TAG: latest }

    tag:nightly:
        desc: Move the `nightly` annotated tag to HEAD and force-push.
        cmds:
            - task: tag:move
              vars: { TAG: nightly }

    tag:edge:
        desc: Move the `edge` annotated tag to HEAD and force-push.
        cmds:
            - task: tag:move
              vars: { TAG: edge }

    # --------------
    # Permanent Tags
    # --------------
    # Semver version tags — created once, never moved.
    # Usage:
    #   task tag:version VERSION=v1.0.0
    #   task tag:version VERSION=v1.0.0 MSG="Initial release"
    tag:version:
        desc: >-
            Synchronize version metadata, then create a permanent semver tag at HEAD and push.
            If synchronization changes files, commit them and rerun. Requires `VERSION=<v1.0.0>`.
            Optional `MSG=<message>`.
        vars:
            VERSION: '{{.VERSION | default ""}}'
            _MSG: '{{.MSG | default (printf "Release %s" .VERSION)}}'
        preconditions:
            - sh: git -C {{._0}} rev-parse --git-dir > /dev/null 2>&1
              msg: Not inside a git repository.
            - sh: '[[ "{{.VERSION}}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
              msg: 'VERSION must be a semver string like `v1.0.0` (pass with `VERSION=<v1.0.0>`).'
            - sh: git -C {{._0}} diff --quiet && git -C {{._0}} diff --cached --quiet
              msg: Commit or stash tracked changes before synchronizing a release version.
        prompt: 'Create version tag `{{.VERSION}}` at HEAD and push to `{{.GIT_REMOTE}}`?'
        cmds:
            - cmd: |
                  set -eu
                  root='{{._0}}'
                  version='{{.VERSION}}'
                  version="${version#v}"

                  if [ -f "$root/pyproject.toml" ]; then
                      command -v uv >/dev/null 2>&1 || {
                          echo "pyproject.toml is present but uv is not installed." >&2
                          exit 1
                      }
                      (cd "$root" && uv version "$version")
                  fi

                  if [ -f "$root/package.json" ]; then
                      command -v bun >/dev/null 2>&1 || {
                          echo "package.json is present but bun is not installed." >&2
                          exit 1
                      }
                      (cd "$root" && bun pm pkg set "version=$version")
                      (cd "$root" && bun install --lockfile-only)
                  fi

                  if ! git -C "$root" diff --quiet || ! git -C "$root" diff --cached --quiet; then
                      echo "Version metadata was synchronized. Commit it, then rerun tag:version." >&2
                      exit 1
                  fi
            - cmd: git -C {{._0}} tag -a '{{.VERSION}}' HEAD -m '{{._MSG}}'
            - cmd: git -C {{._0}} push '{{.GIT_REMOTE}}' '{{.VERSION}}'

    # Pre-release tags (rc, beta, alpha).
    # Usage:
    #   task tag:prerelease -- VERSION=v1.0.0-rc.1
    #   task tag:prerelease -- VERSION=v1.0.0-beta.3 MSG="Feature freeze"
    tag:prerelease:
        desc: >-
            Create a pre-release tag (rc/beta/alpha) at HEAD and push.  Requires
            `VERSION=<v1.0.0-rc.1>`.  Optional `MSG=<message>`.
        vars:
            VERSION: '{{.VERSION | default ""}}'
            _MSG: '{{.MSG | default (printf "Pre-release %s" .VERSION)}}'
        preconditions:
            - sh: git -C {{._0}} rev-parse --git-dir > /dev/null 2>&1
              msg: Not inside a git repository.
            - sh: '[[ "{{.VERSION}}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(rc|beta|alpha)\.?[0-9]*$ ]]'
              msg: 'VERSION must be a pre-release semver like `v1.0.0-rc.1`.'
        prompt: 'Create pre-release tag `{{.VERSION}}` at HEAD and push to `{{.GIT_REMOTE}}`?'
        cmds:
            - cmd: git -C {{._0}} tag -a '{{.VERSION}}' HEAD -m '{{._MSG}}'
            - cmd: git -C {{._0}} push '{{.GIT_REMOTE}}' '{{.VERSION}}'

    # ---------
    # Utilities
    # ---------
    tag:list:
        desc: List all git tags, sorted by version (newest first).
        cmd: git -C {{._0}} tag -l --sort=-v:refname

    tag:push:
        desc: Push all local tags to the remote.
        cmd: git -C {{._0}} push '{{.GIT_REMOTE}}' --tags

    tag:clean:
        desc: >-
            Prune local tags (and stale remote-tracking branches) that no longer
            exist on the remote.
        cmd: git -C {{._0}} fetch '{{.GIT_REMOTE}}' --prune --prune-tags

    agent:new:
        cmd: '{{.AWT}} new {{.CLI_ARGS}}'
        desc: 'Provision an isolated worktree+branch: `task agent:new -- MEMY-88 "short desc"`.'
        aliases: [wt:new]

    agent:list:
        cmd: '{{.AWT}} list'
        desc: List the live agent/* worktrees with ahead/dirty status.
        aliases: [wt:list, wt:ls]

    agent:merge:
        cmd: '{{.AWT}} merge {{.CLI_ARGS}}'
        desc: 'Land a reviewed branch into main and push by default: `task agent:merge -- agent/<branch>`.'
        aliases: [wt:merge, wt:land]

    agent:abandon:
        cmd: '{{.AWT}} abandon {{.CLI_ARGS}}'
        desc: 'Discard a rejected branch + its worktree: `task agent:abandon -- agent/<branch>`.'
        aliases: [wt:abandon]

    agent:gc:
        cmd: '{{.AWT}} gc'
        desc: Prune merged agent/* branches past the grace window.
        aliases: [wt:gc]

    sync:
        cmd: '{{.UV}} sync --all-extras {{.CLI_ARGS}}'
        aliases: [install, setup]
        desc: Install & verify dependencies through `uv sync`, including all optional and dev
            dependencies.

    # MEMY-1135: shared helper folding the `if [ -x WORKRUN ]` fallback that used to be
    # duplicated at every heavy-task call site. A workrun that EXISTS but is not executable
    # used to fall through to running bare with no warning at all -- silently unjailed,
    # indistinguishable from a host where corpus isn't checked out. This warns once, then
    # falls back either way: a jail that cannot be entered must never be the reason the task
    # doesn't run (workrun's own --auto invariant). Callers pass the target command as CMD
    # and, optionally, a progress LABEL and one `NAME=VALUE` pair as SETENV -- shell-quoted
    # here (MEMY-1136) rather than spliced unquoted into an interpolated command line at each
    # site: Taskfile's own `{{ }}` template interpolation happens before the shell ever sees
    # the resulting line, so a literal `"..."` in the source is not enough on its own to make
    # an interpolated value safe -- the same family of gap as Jinja-vs-Taskfile in copier
    # templates (COP-jinja-clash), just for Task's own templating instead.
    _workrun:
        internal: true
        vars:
            LABEL: '{{.LABEL | default ""}}'
            SETENV: '{{.SETENV | default ""}}'
        cmd: |
            {{if .LABEL}}printf '\033[1m── %s ──\033[0m\n' {{.LABEL | shellQuote}}
            {{end}}if [ -e "{{.WORKRUN}}" ] && [ ! -x "{{.WORKRUN}}" ]; then
              echo "workrun: found at {{.WORKRUN}} but not executable -- running unjailed (chmod +x to fix)." >&2
            fi
            if [ -x "{{.WORKRUN}}" ]; then
              "{{.WORKRUN}}" --auto {{if .SETENV}}-e {{.SETENV | shellQuote}} {{end}}-- {{.CMD}}
            else
              {{if .SETENV}}env {{.SETENV | shellQuote}} {{end}}{{.CMD}}
            fi

    # ----------
    # Evaluation
    # ----------
    eval:
        desc: Verify formatting, lint, and types across the codebase (read-only — never writes).
        deps:
            - eval:check
        cmds:
            - task: eval:lint
            - task: eval:typecheck

    eval:lint:
        cmd: '{{.UV}} run ruff check {{.CLI_ARGS}}'
        desc: Catch logic & semantic errors with `ruff check`.
        aliases: [ch, ruff, check]

    eval:typecheck:
        desc: Verify types and import structure with `pyrefly check`.
        aliases: [ty, types]
        cmds:
            - task: _workrun
              vars:
                  CMD: '{{.UV}} run pyrefly check {{.CLI_ARGS}}'

    eval:typecheck:matrix:
        desc: Typecheck against every supported interpreter (`3.pyver .. 3.pymax`). `pyrefly`'s
            configured `python-version` should be the FLOOR, so this adds the newer ones.
        aliases: [tym, types-matrix, typecheck-matrix]
        vars:
            PYVERS:
                sh: |
                    pyver='{{get .REPO "pyver"}}'
                    pymax='{{get .REPO "pymax" | default (get .REPO "pyver")}}'
                    if [ -z "$pyver" ]; then
                      echo 'eval:typecheck:matrix requires `pyver` in .repo.yaml.' >&2
                      exit 1
                    fi
                    seq "$pyver" "$pymax" | sed 's/^/3./'
        cmds:
            - for: { var: PYVERS, split: "\n", as: V }
              task: _workrun
              vars:
                  LABEL: 'pyrefly @ py{{.V}}'
                  CMD: '{{.UV}} run pyrefly check --python-version {{.V}} {{.CLI_ARGS}}'

    # Format verification — `eval:check` is the read-only umbrella that `eval` depends on.
    # Every leaf runs its formatter's check/lint mode and never writes. With no arguments the
    # umbrella runs every leaf against the whole tree; with arguments it dispatches each path to
    # the leaf matching its extension and rejects anything no leaf handles — fanning one path
    # out to every formatter is the MEMY-1111 footgun. Directories and unmatched file types
    # belong to the scoped leaves: each still accepts `{{.CLI_ARGS}}` directly and checks the
    # whole tree when called bare, honoring the same per-project config files the in-place
    # formatters use.
    eval:check:
        desc: Check formatting without writing; scoped arguments dispatch per extension.
        aliases: ['check:format', fmt-check, 'fmt:check']
        cmd: |
            set -e
            if [ -z '{{.CLI_ARGS}}' ]; then
              task eval:check:py
              task eval:check:md
              task eval:check:yaml
              task eval:check:toml
              task eval:check:typ
              exit 0
            fi
            py='' md='' yaml='' toml='' typ='' bad=''
            for f in {{.CLI_ARGS}}; do
              case "$f" in
                *.py|*.pyi)   py="$py $f" ;;
                *.md)         md="$md $f" ;;
                *.yaml|*.yml) yaml="$yaml $f" ;;
                *.toml)       toml="$toml $f" ;;
                *.typ)        typ="$typ $f" ;;
                *)            bad="$bad $f" ;;
              esac
            done
            if [ -n "$bad" ]; then
              echo "eval:check: no formatter matches:$bad — call the scoped eval:check:* leaf directly for directories or other file types." >&2
              exit 1
            fi
            if [ -n "$py" ]; then task eval:check:py -- $py; fi
            if [ -n "$md" ]; then task eval:check:md -- $md; fi
            if [ -n "$yaml" ]; then task eval:check:yaml -- $yaml; fi
            if [ -n "$toml" ]; then task eval:check:toml -- $toml; fi
            if [ -n "$typ" ]; then task eval:check:typ -- $typ; fi

    eval:check:py:
        cmd: '{{.UV}} run ruff format --check {{.CLI_ARGS}}'
        desc: Check python formatting with `ruff format --check` (read-only).
        aliases: ['check:py']

    eval:check:md:
        desc: Check markdown formatting with `mdformat --check` (reads `.mdformat.toml`); skipped
            if mdformat is not installed in the env.
        cmd: |
            if ! {{.UV}} run --quiet mdformat --version >/dev/null 2>&1; then
              echo "mdformat not installed in this env — skipping markdown check." >&2
            elif [ -n "{{.CLI_ARGS}}" ]; then
              {{.UV}} run mdformat --check {{.CLI_ARGS}}
            else
              {{.UV}} run mdformat --check .
            fi

    eval:check:yaml:
        desc: Check yaml formatting with `yamlfmt -lint` (reads `.yamlfmt.yaml`); skipped if
            yamlfmt is not on PATH (it is a Go binary, not pip-installable).
        cmd: |
            if ! command -v yamlfmt >/dev/null 2>&1; then
              echo "yamlfmt not found on PATH — skipping yaml check." >&2
            elif [ -n "{{.CLI_ARGS}}" ]; then
              yamlfmt -lint {{.CLI_ARGS}}
            else
              yamlfmt -lint
            fi

    eval:check:toml:
        desc: Check toml formatting with `taplo format --check` (reads `.taplo.toml`); skipped
            if taplo is not installed in the env.
        cmd: |
            unset TAPLO_CONFIG 2>/dev/null || true
            if ! {{.UV}} run --quiet taplo --version >/dev/null 2>&1; then
              echo "taplo not installed in this env — skipping toml check." >&2
            elif [ -n "{{.CLI_ARGS}}" ]; then
              {{.UV}} run taplo format --check {{.CLI_ARGS}}
            else
              {{.UV}} run taplo format --check '**/*.toml'
            fi

    eval:check:typ:
        desc: Check typst formatting with `typstyle --check` (no config file); skipped if typstyle
            is not on PATH. Excludes `journal/`, which is a record rather than source.
        cmd: |
            if ! command -v typstyle >/dev/null 2>&1; then
              echo "typstyle not found on PATH — skipping typst check." >&2
            elif [ -n "{{.CLI_ARGS}}" ]; then
              for f in {{.CLI_ARGS}}; do
                typstyle --check "$f"
              done
            else
              # `journal/` is excluded on purpose, matching what ruff (`extend-exclude`) and
              # pyrefly (`project-excludes`) already do for the same tree. It holds durable
              # records, including verbatim receipts pinned by hash -- and reformatting one
              # is not a style change, it destroys the thing the receipt is evidence of. That
              # is not hypothetical: a bulk journal commit once moved a pinned document off
              # its blob hash and broke 11 of 28 manifest entries (MEMY-1410). Without this,
              # every journal commit also re-reds `main` for a tree no gate should rewrite.
              find . -type f -name '*.typ' -not -path './.venv/*' -not -path './.git/*' \
                -not -path './journal/*' \
                -print0 | xargs -0 -r typstyle --check
            fi

    # Formatting — `eval:format` is the in-place counterpart of the `eval:check` umbrella.
    # With no arguments it runs every leaf against the whole tree, leaf by leaf; with
    # arguments it dispatches each path to the formatter for its extension and rejects
    # anything no leaf handles. Fanning one path out to every formatter let yamlfmt destroy
    # Python sources (MEMY-1111), so the umbrella never passes a leaf a path the leaf does
    # not own. Directories and unmatched file types belong to the scoped leaves, which
    # retain their standalone no-argument whole-tree behavior. `eval` never formats — it
    # verifies via the read-only `eval:check` umbrella above. Config lives in the
    # per-project `.mdformat.toml` / `.taplo.toml` / `.yamlfmt.yaml` (these tools do not
    # read pyproject.toml).
    eval:format:
        desc: Format the whole tree (no arguments) or explicitly named paths in place,
            dispatching each to its extension's formatter; unmatched paths are rejected.
        aliases: [fm, fmt, format]
        cmd: |
            set -e
            if [ -z '{{.CLI_ARGS}}' ]; then
              task eval:format:py
              task eval:format:md
              task eval:format:yaml
              task eval:format:toml
              task eval:format:typ
              exit 0
            fi
            py='' md='' yaml='' toml='' typ='' bad=''
            for f in {{.CLI_ARGS}}; do
              case "$f" in
                *.py|*.pyi)   py="$py $f" ;;
                *.md)         md="$md $f" ;;
                *.yaml|*.yml) yaml="$yaml $f" ;;
                *.toml)       toml="$toml $f" ;;
                *.typ)        typ="$typ $f" ;;
                *)            bad="$bad $f" ;;
              esac
            done
            if [ -n "$bad" ]; then
              echo "eval:format: no formatter matches:$bad — call the scoped eval:format:* leaf directly for directories or other file types." >&2
              exit 1
            fi
            if [ -n "$py" ]; then task eval:format:py -- $py; fi
            if [ -n "$md" ]; then task eval:format:md -- $md; fi
            if [ -n "$yaml" ]; then task eval:format:yaml -- $yaml; fi
            if [ -n "$toml" ]; then task eval:format:toml -- $toml; fi
            if [ -n "$typ" ]; then task eval:format:typ -- $typ; fi

    eval:format:py:
        cmd: '{{.UV}} run ruff format {{.CLI_ARGS}}'
        desc: Format python in place with `ruff format`.
        aliases: ['fmt:py', 'format:py']

    eval:format:md:
        desc: Format markdown in place with `mdformat` (reads `.mdformat.toml`); skipped if
            mdformat is not installed in the env.
        cmd: |
            if ! {{.UV}} run --quiet mdformat --version >/dev/null 2>&1; then
              echo "mdformat not installed in this env — skipping markdown formatting." >&2
            elif [ -n "{{.CLI_ARGS}}" ]; then
              {{.UV}} run mdformat {{.CLI_ARGS}}
            else
              {{.UV}} run mdformat .
            fi

    eval:format:yaml:
        desc: Format yaml in place with `yamlfmt` (reads `.yamlfmt.yaml`); skipped if yamlfmt
            is not on PATH (it is a Go binary, not pip-installable).
        cmd: |
            if ! command -v yamlfmt >/dev/null 2>&1; then
              echo "yamlfmt not found on PATH — skipping yaml formatting." >&2
            elif [ -n "{{.CLI_ARGS}}" ]; then
              yamlfmt {{.CLI_ARGS}}
            else
              yamlfmt
            fi

    eval:format:toml:
        desc: Format toml in place with `taplo format` (reads `.taplo.toml`); skipped if taplo
            is not installed in the env.
        cmd: |
            unset TAPLO_CONFIG 2>/dev/null || true
            if ! {{.UV}} run --quiet taplo --version >/dev/null 2>&1; then
              echo "taplo not installed in this env — skipping toml formatting." >&2
            elif [ -n "{{.CLI_ARGS}}" ]; then
              {{.UV}} run taplo format {{.CLI_ARGS}}
            else
              {{.UV}} run taplo format '**/*.toml'
            fi

    eval:format:typ:
        desc: Format typst in place with `typstyle -i` (no config file); skipped if typstyle
            is not on PATH.
        cmd: |
            if ! command -v typstyle >/dev/null 2>&1; then
              echo "typstyle not found on PATH — skipping typst formatting." >&2
            elif [ -n "{{.CLI_ARGS}}" ]; then
              for f in {{.CLI_ARGS}}; do
                typstyle -i "$f"
              done
            else
              find . -type f -name '*.typ' -not -path './.venv/*' -not -path './.git/*' \
                -print0 | xargs -0 -r typstyle -i
            fi

    # ----------
    # Pre-Commit
    # ----------
    # The fast, high-frequency per-commit gate: format then lint STAGED FILES ONLY, fail-fast.
    # `eval` is the whole-tree CI/manual analogue; pyrefly and pytest stay out of the per-commit
    # path. Wire the git hook (prek.toml / .pre-commit-config.yaml) to a single thin `local` hook
    # that runs `task precommit` with `pass_filenames: false` — this task does its own git-diff
    # scoping so the hook stays declarative and tool versions live in uv.lock, not the hook config.
    precommit:
        desc: Fast per-commit gate — format + lint staged files only.
        aliases: [pre-commit, quick]
        cmds:
            - task: precommit:format
            - task: precommit:lint

    precommit:format:
        desc: Format staged python, markdown, yaml, toml, and typst files.
        cmd: |
            set -e
            unset TAPLO_CONFIG 2>/dev/null || true
            git diff -z --diff-filter=d --cached --name-only -- '*.py' \
              | xargs -0 -r {{.UV}} run ruff format
            if {{.UV}} run --quiet mdformat --version >/dev/null 2>&1; then
              git diff -z --diff-filter=d --cached --name-only -- '*.md' \
                | xargs -0 -r {{.UV}} run mdformat
            fi
            if {{.UV}} run --quiet taplo --version >/dev/null 2>&1; then
              git diff -z --diff-filter=d --cached --name-only -- '*.toml' \
                | xargs -0 -r {{.UV}} run taplo format
            fi
            if command -v yamlfmt >/dev/null 2>&1; then
              git diff -z --diff-filter=d --cached --name-only -- '*.yaml' '*.yml' \
                | xargs -0 -r yamlfmt
            fi
            if command -v typstyle >/dev/null 2>&1; then
              git diff -z --diff-filter=d --cached --name-only -- '*.typ' \
                | xargs -0 -r typstyle -i
            fi

    precommit:lint:
        desc: Lint staged python files with `ruff check --fix`.
        cmd: |-
            set -e
            git diff -z --diff-filter=d --cached --name-only -- '*.py' \
              | xargs -0 -r {{.UV}} run ruff check --fix

    # -------
    # Testing
    # -------
    # MEMY-1123: the four below route through workrun (see py-base.taskfile's WORKRUN var) —
    # full/coverage/matrix/floor sweeps are exactly the sustained-RSS, sustained-core workloads
    # host_load.md's WR-mandatory names. test:pdb and test:tty stay bare: an interactive debugger
    # and a PTY-behavior test suite are each already juggling one pty layer, and systemd-run
    # --pty nesting a second on top is an unverified interaction not worth risking here.
    test:
        aliases: [pt, tests, pytest]
        desc: Dynamically assess the codebase by running `pytest` with no filters applied.
        cmds:
            - task: _workrun
              vars:
                  CMD: '{{.UV}} run pytest {{.CLI_ARGS}}'

    test:dev:
        aliases: [dev-test]
        desc: Run iterative developer tests that stop upon first failure, showing extra output
            and skipping code coverage.
        cmds:
            - task: _workrun
              vars:
                  CMD: '{{.UV}} run pytest --sw -vv {{.CLI_ARGS}}'

    test:pdb:
        cmd: '{{.UV}} run pytest -s --pdb --sw -vv {{.CLI_ARGS}}'
        aliases: [pdb-test, debug-test]
        desc: The same as dev-test, but also drop into the interactive debugger upon exception
            or failure.

    test:ssu:
        aliases: [snapshot-test, ssu-test, snap-test]
        desc: Update regression test "snapshot" files to reflect the new truth.
        cmds:
            - task: _workrun
              vars:
                  CMD: '{{.UV}} run pytest --snapshot-update {{.CLI_ARGS}}'

    test:tty:
        cmd: '{{.UV}} run pytest --run-tty -m tty {{.CLI_ARGS}}'
        aliases: [tty-test, tty]
        desc: Run the expensive PTY/TUI integration tests (skipped by default in `task test`).

    test:cov:
        aliases: [coverage, cov-test, coverage-test]
        desc: Report code coverage of our unit tests to stdout and `tests/coverage.md`.
        cmds:
            - task: _workrun
              vars:
                  CMD: >-
                      {{.UV}} run pytest --cov "{{._PACKAGE | default ._PACKAGE_DEFAULT}}"
                      --cov-branch --no-cov-on-fail {{.CLI_ARGS}}
                      --cov-report term-missing --cov-report markdown:tests/coverage.md

    test:matrix:
        desc: Run the suite on every supported interpreter (`3.pyver .. 3.pymax`).
        aliases: [matrix, matrix-test, test-matrix]
        vars:
            # Keep the shell expansion task-local: global dynamic vars run for unrelated tasks.
            PYVERS:
                sh: |
                    pyver='{{get .REPO "pyver"}}'
                    pymax='{{get .REPO "pymax" | default (get .REPO "pyver")}}'
                    if [ -z "$pyver" ]; then
                      echo 'test:matrix requires `pyver` in .repo.yaml.' >&2
                      exit 1
                    fi
                    seq "$pyver" "$pymax" | sed 's/^/3./'
        cmds:
            - for: { var: PYVERS, split: "\n", as: V }
              task: _workrun
              vars:
                  LABEL: 'py{{.V}}'
                  SETENV: 'UV_PROJECT_ENVIRONMENT={{._0}}/.venvs/py{{.V}}'
                  CMD: '{{.UV}} run --python {{.V}} --all-extras pytest -q {{.CLI_ARGS}}'

    test:floor:
        desc: Verify the declared dependency floors actually resolve and pass on the oldest
            supported interpreter -- catches `requires-python` drifting away from the pins.
        aliases: [floor, floor-test, test-floor]
        vars:
            PYMIN: '3.{{get .REPO "pyver"}}'
            _FLOOR_ENV: 'UV_PROJECT_ENVIRONMENT={{._0}}/.venvs/floor'
        cmds:
            # MEMY-1123: the sync leg is itself sustained I/O (dependency resolution + network +
            # disk writes) -- route it through the jail too, not just the pytest invocation that
            # follows it. Task's cmds list stops at the first failing entry, same as the `set -e`
            # this replaces, so a failed sync never reaches the pytest leg.
            - task: _workrun
              vars:
                  SETENV: '{{._FLOOR_ENV}}'
                  CMD: "{{.UV}} sync --python '{{.PYMIN}}' --all-extras --resolution lowest-direct"
            - task: _workrun
              vars:
                  SETENV: '{{._FLOOR_ENV}}'
                  CMD: "{{.UV}} run --no-sync --python '{{.PYMIN}}' pytest -q {{.CLI_ARGS}}"

    # ----------------------
    # Project-Specific Tasks
    # ----------------------
    # These are hand-added to this generated file and are NOT part of the corpus template.
    # The `tests/test_ci_taskfile.py` regression test guards them against copier sync drops
    # (commit 4b6167f once silently removed them, breaking the `Test Artifacts` CI job).
    test:artifacts:
        aliases: [artifact-test, test-artifact]
        desc: Build wheel and sdist, then verify the Python/Typst and packaged-skill boundaries.
        cmd: |
            set -eu
            artifact_root="$(mktemp -d "${TMPDIR:-/tmp}/basis-artifacts.XXXXXX")"
            trap 'rm -rf "$artifact_root"' EXIT
            {{.UV}} build --no-sources --out-dir "$artifact_root"
            {{.UV}} run --locked python scripts/check_release_artifacts.py \
              "$artifact_root"/*.whl "$artifact_root"/*.tar.gz

    test:typst:
        aliases: [typst-test, test-typst]
        desc: Compile the independent @dtm/basis fixtures and verify their report envelope.
        cmd: sh '{{._0}}/typst/test.sh'

    # -------------
    # Documentation
    # -------------
    docs:
        desc: Run the full documentation pipeline.
        aliases: [sphinx]
        cmds:
            - task: docs:sync
            - task: docs:build

    docs:sync:
        desc: Update generated docs from source code.
        aliases: [sync-docs, sphinx-sync]
        cmd: '{{.UV}} run sync-docs --package "{{._PACKAGE}}" "{{._0}}" {{.CLI_ARGS}}'
        sources: ['{{.SRC_DIR}}/**/*.py']
        generates: ['{{.DOC_DIR}}/*.md']

    docs:build:
        desc: Build the MyST docs into finalized webpages.
        aliases: [build-docs]
        # `-E --fail-on-warning` is the canonical strict gate (see skills/py-docs-guide): a
        # fresh, warning-free build. `--nitpicky` is deliberately NOT set — with eval-rst
        # rendering it flags every un-intersphinx'd external type xref in signatures,
        # producing hundreds of noise warnings (even basis fails it with 537) for no gain.
        cmd: >-
            {{.UV}} run sphinx-build -E --fail-on-warning {{.CLI_ARGS}}
            {{.DOC_DIR}} {{.DOC_OUT}}
        sources:
            # Sphinx autodoc imports configured packages, even when docs:sync is skipped.
            - '{{.AUTODOC_SOURCE_GLOB}}'
            - '{{.DOC_DIR}}/**/*.md'
            - '{{.DOC_DIR}}/conf.py'
        generates: ['{{.DOC_OUT}}/*']

    docs:clean:
        desc: Remove all generated documentation files.
        aliases: [clean-docs, sphinx-clean]
        cmd: rm -rf {{.DOC_OUT}}/*

    docs:publish:
        desc: Publish finalized Sphinx artifacts to ReadTheDocs.
        aliases: [publish-docs, readthedocs]
        cmd: echo "docs:publish not yet implemented..."
        preconditions: ['false']

    # ---------------
    # Container Image
    # ---------------
    pod:build:
        cmd: '{{.OP}} build -t {{.IMG}} -f {{.IMG_FILE}} {{._0}}'
        desc: Build the container image.
        sources:
            - '{{._0}}/{{.IMG_FILE}}'
            - '{{._0}}/.repo.yaml'
        generates:
            - '{{.OP}} image inspect {{.IMG}}'
        preconditions:
            - sh: stat {{._0}}/{{.IMG_FILE}}
              msg: Containerfile not found in `{{.IMG_FILE}}`.
            - sh: stat {{._0}}/.repo.yaml
              msg: Repo data not found in `.repo.yaml`

    pod:test:
        cmd: >-
            {{.OP}} run --rm -v {{._0}}:/workspace:ro {{.IMG}} run pytest {{.CLI_ARGS}}
        desc: Run the test suite inside the container locally (mirrors the CI job).
        deps: ['pod:build']

    pod:push:
        cmd: '{{.OP}} push {{.IMG}}'
        desc: Push the built image to the GitLab Container Registry.

    # --------------
    # PyPI Packaging
    # --------------
    pkg:build:
        cmd: '{{.UV}} build --no-sources --wheel {{.CLI_ARGS}}'
        desc: Build a distributable wheel of this package through `uv build`.

    pkg:publish:
        cmd: '{{.UV}} publish {{.CLI_ARGS}}'
        desc: >-
            Break-glass local upload to PyPI with a long-lived PYPI_TOKEN. The
            PRIMARY path is the tag-triggered CI publish job (trusted publishing /
            OIDC, no stored token) -- use this only when CI is unavailable.
        env:
            UV_PUBLISH_TOKEN: '{{.PYPI_TOKEN}}'
        preconditions:
            - sh: '[[ -n $PYPI_TOKEN ]]'
              msg: PYPI_TOKEN environment variable is not set.

    pkg:publish:check:
        cmd: '{{.UV}} publish --dry-run {{.CLI_ARGS}}'
        desc: Validate the distribution without uploading (dry run).

    pkg:publish:test:
        cmd: >-
            {{.UV}} publish --publish-url https://test.pypi.org/legacy/ {{.CLI_ARGS}}
        desc: Upload to TestPyPI for verification before a real release.
        env:
            UV_PUBLISH_TOKEN: '{{.PYPI_TEST_TOKEN}}'
        preconditions:
            - sh: '[[ -n $PYPI_TEST_TOKEN ]]'
              msg: PYPI_TEST_TOKEN environment variable is not set.

    pkg:release:
        desc: >-
            Prepare a release: bump the version and validate the build, but do NOT
            upload. Publication is the tag-triggered CI job (Publish PyPI) --
            commit the bump, then tag `v<version>` and push the tag to trigger it.
            Override BUMP= to control the increment (major, minor, patch).
        cmds:
            - cmd: '{{.UV}} version --bump {{.BUMP | default "patch"}}'
            - task: pkg:build
            - task: pkg:publish:check
            - cmd: |
                V=$({{.UV}} version --short)
                echo ""
                echo "Version bumped to $V and build validated (dry-run OK)."
                echo "Publish happens in CI on the tag. Next:"
                echo "  git commit -am \"chore: release v$V\""
                echo "  git tag v$V && git push origin v$V"
                echo "(Break-glass local upload: task pkg:publish)"

    pkg:release:patch:
        desc: Release a new patch version (e.g. 1.2.3 → 1.2.4).
        vars:
            BUMP: 'patch'
        cmds:
            - task: pkg:release

    pkg:release:minor:
        desc: Release a new minor version (e.g. 1.2.3 → 1.3.0).
        vars:
            BUMP: 'minor'
        cmds:
            - task: pkg:release

    pkg:release:major:
        desc: Release a new major version (e.g. 1.2.3 → 2.0.0).
        vars:
            BUMP: 'major'
        cmds:
            - task: pkg:release
