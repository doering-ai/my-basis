# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

includes:
    my:
        taskfile: ./../Taskfile.yaml

tasks:
    sync:
        cmds:
            - task: 'my:sync'

    build:
        cmds:
            - task: 'my:build'

    lint:
        cmds:
            - task: 'my:lint'

    format:
        cmds:
            - task: 'my:format'

    typecheck:
        cmds:
            - task: 'my:typecheck'

    docs:
        cmds:
            - task: 'my:docs'

    docs:clean:
        cmds:
            - task: 'my:docs:clean'

    # -------
    # Testing
    # -------
    test:
        cmd: uv --project {{.ROOT_DIR}} run st_pytest --package myHeaders {{.CLI_ARGS}}
        desc: Execute `pytest` within a Sublime Text instance, proxying the output
            to the terminal."
        aliases: [tests, pytest, st_pytest]

    test:dev:
        cmd: uv --project {{.ROOT_DIR}} run st_pytest --package myHeaders  --sw -vv
            --no-cov {{.CLI_ARGS}}
        aliases: [dev-test]
        desc: Run dev tests within a Sublime Text instance, showing extra output and
            skipping code coverage.

    test:pdb:
        cmd: uv --project {{.ROOT_DIR}} run st_pytest --package myHeaders -s --pdb
            --sw -vv --no-cov {{.CLI_ARGS}}
        aliases: [pdb-test]
        desc: Run dev tests and drop into the interactive debugger upon exception
            or failure.

    test:ssu:
        cmd: uv --project {{.ROOT_DIR}} run st_pytest --package myHeaders --snapshot-update
            {{.CLI_ARGS}}
        aliases: [snapshot-test]
        desc: Update regression test "snapshot" files to reflect new changes within
            a Sublime Text instance..

    test:cov:
        cmd: uv --project {{.ROOT_DIR}} run st_pytest --package myHeaders --cov=my
            --cov-report=term-missing --cov-report=markdown:tests/coverage.md {{.CLI_ARGS}}
        desc: Report code coverage of our unit tests to stdout and `tests/coverage.md`
            within a Sublime Text instance.
