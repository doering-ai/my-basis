# Guided overall by https://docs.astral.sh/uv/guides/integration/gitlab/
# Modeled on the sibling `test` repo's pipeline (../test/.gitlab-ci.yml).
############
### HEAD ###
############
stages:
  - test
  - eval

# Import static analysis tools
include:
  - template: Security/Secret-Detection.gitlab-ci.yml
  - component: gitlab.com/gitlab-org/professional-services-automation/tools/utilities/pipeintel/pipeintel@1.0.0
    inputs:
      stage: eval
      offline: true

# Only run the pipeline for non-draft commits in a Merge Request or directly onto the main branch.
workflow:
  rules:
    - if: '$CI_COMMIT_TITLE =~ /-draft$/ || $CI_MERGE_REQUEST_DRAFT == "true"'
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

############
### DATA ###
############
variables:
  PACKAGE: myBasis
  # basis has no Containerfile of its own; jobs run inside the shared Sublime test-harness
  # image built and pushed by the sibling `test` project (ST runtime + task + uv).
  MAIN_POD: registry.gitlab.com/doering-ai/sublime/pytest@sha256:996367c924f86d9270872928a41b9ec5d2cbdbddde8e6343ee02d1b69ffbe1e4
  SECRET_DETECTION_ENABLED: 'true'
  UV_CACHE_DIR: .uv-cache
  USER: my

cache:
  key:
    files:
      - uv.lock
  paths:
    - $UV_CACHE_DIR

############
### BODY ###
############
default:
  image:
    name: $MAIN_POD
    entrypoint: [""]

secret_detection:
  stage: eval
  cache: []

# The digest-pinned harness image is isolated per Docker job, so ST_TEST is trusted after
# validating its directory, executable, and import contract; writable paths are not shared.
test-plugin:
  stage: test
  before_script:
    - cd "$CI_PROJECT_DIR"
    - test -n "$ST_TEST"
    - test -d "$ST_TEST"
    - test -x "$ST_TEST/.venv/bin/python"
    - >-
      "$ST_TEST/.venv/bin/python" -c
      "import myBasis, pytest, sublime, sublime_plugin, unittesting"
  script:
    - uv run --project "$ST_TEST" --no-sync python -m pytest tests

Evaluate Python:
  stage: eval
  before_script:
    - cd "$CI_PROJECT_DIR"
    - test -n "$ST_TEST"
    - test -d "$ST_TEST"
    - test -x "$ST_TEST/.venv/bin/python"
    - test -x "$ST_TEST/.venv/bin/ruff"
    - test -x "$ST_TEST/.venv/bin/pyrefly"
    - >-
      "$ST_TEST/.venv/bin/python" -c
      "import myBasis, pytest, sublime, sublime_plugin, unittesting"
  interruptible: true
  script:
    - >-
      "$ST_TEST/.venv/bin/ruff" check --no-cache
      --output-format=gitlab --output-file=code-quality-report.json .
    - uv pip install --python "$ST_TEST/.venv/bin/python"
      'types-regex==2024.11.6.20241221'
    - site_packages=$("$ST_TEST/.venv/bin/python" -c
      'import sysconfig; print(sysconfig.get_path("purelib"))')
    - test -d "$site_packages"
    - api_path=$(mktemp -d)
    - cp "$CI_PROJECT_DIR/myBasis/infra/mock/_sublime.py" "$api_path/sublime.py"
    - cp "$CI_PROJECT_DIR/myBasis/infra/mock/_sublime_plugin.py" "$api_path/sublime_plugin.py"
    - cp "$CI_PROJECT_DIR/myBasis/infra/mock/_unittesting.py" "$api_path/unittesting.py"
    - >-
      "$ST_TEST/.venv/bin/pyrefly" check
      --config "$CI_PROJECT_DIR/pyproject.toml"
      --python-interpreter-path "$ST_TEST/.venv/bin/python"
      --site-package-path "$site_packages"
      --search-path "$CI_PROJECT_DIR" --search-path "$api_path"
      "$CI_PROJECT_DIR/myBasis" "$CI_PROJECT_DIR/tests"
  artifacts:
    reports:
      codequality: $CI_PROJECT_DIR/code-quality-report.json
