###################
### I. METADATA ###
###################
[project]
name = "mysublime-basis"
version = "0.1.0"
description = "A basis for using, extending, and designing SublimeText plugins."
requires-python = "==3.8.*"
urls = { Homepage = "https://gitlab.com/doering-thinking-machines/libs/sublime/basis" }


########################
### II. DEPENDENCIES ###
########################
dependencies = [
  "more-itertools>=10.5.0",
  "pydantic>=2.10.6",
  "regex>=2024.11.6",
  "ruamel-yaml>=0.18.16",
  "sublime-lib",
  "toolz>=1.0.0",
]

[dependency-groups]
dev = [
  "ruff>=0.14.14",
  "ty>=0.0.14",
  "sublime-stubs",
  "types-regex>=2024.11.6.20241221",
  "typing-extensions>=4.13.2",
  "types-xmltodict>=0.14.0.20241009",
  "xmltodict>=0.15.0",
  "annotated-types>=0.7.0",
  "eval-type-backport>=0.3.1",
]


#########################
### III. BUILD SYSTEM ###
#########################
[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "myBasis"
module-root = ""
namespace = true

[tool.uv.sources]
sublime-stubs = { path = "../_stubs", editable = true }
sublime-lib = { path = "../_lib" }

#############################
### IV. DEVELOPMENT TOOLS ###
#############################
[tool.ruff]
target-version = "py38"
extend = '~/.config/ruff/pyproject.toml'
exclude = ['.venv', 'venv', 'dist', '__pycache__']

[tool.ruff.lint]
ignore = ['UP', 'TC001', 'TC002', 'TC003', 'PT']

[tool.ruff.lint.per-file-ignores]
'test/**.py' = ['D']
'tests/**.py' = ['D']

[tool.pyright]
strictListInference = true
strictDictInference = true
strictSetInference = true
enableReachabilityAnalysis = false
reportImportCycles = "warning"
reportDeprecated = "warning"
reportUnusedVariable = false
reportUnreachable = false
reportMissingModuleSource = false