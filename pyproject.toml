[project]
name = "MySublimeBasis"
version = "0.1.0"
description = "A basis for using, extending, and designing SublimeText plugins."
requires-python = ">=3.13"
dependencies = ["mybasis"]

[project.urls]
Homepage = "https://gitlab.com/doering-thinking-machines/libs/sublime/basis"

[dependency-groups]
dev = ["ruff>=0.14.14", "ty>=0.0.14"]

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mysublime_basis"
module-root = ""

[tool.uv.sources]
mybasis = { path = "../../basis", editable = true }
