# yaml-language-server: $schema=https://taskfile.dev/schema.json
# Generated by copier from corpus taskfiles; any changes here must be merged.

version: '3'

vars:
    _0: '{{.TASK_DIR}}'
    GIT_REMOTE: '{{.GIT_REMOTE | default "origin"}}'
    CORPUS: '{{.MY_CORPUS | default "~/my/corpus"}}'
    AWT: uv run --project {{.CORPUS}} agent-worktree --repo {{._0}}
    UV: uv --project {{._0}}
    REPO_YAML:
        sh: cat {{._0}}/.repo.yaml 2>/dev/null || echo {}
    REPO:
        ref: fromYaml .REPO_YAML
    _PACKAGE_DEFAULT: '{{get .REPO "package"}}'
    PYVERS:
        sh: seq {{get .REPO "pyver"}} {{get .REPO "pymax" | default (get .REPO "pyver")}} | sed 's/^/3./' | tr '\n' ' '
    _PACKAGE: '{{get .REPO "package"}}'
    SRC_DIR: '{{._0}}/{{._PACKAGE}}'
    DOC_DIR: '{{._0}}/docs'
    DOC_OUT: '{{.DOC_DIR}}/_build'
    OP: podman
    IMG_FILE: Containerfile
    IMG_URL: registry.{{get .REPO "host"}}/{{get .REPO "host_path_full_"}}
    IMG: '{{.IMG_URL}}:latest'

tasks:

    # -------------
    # Moving Tags
    # -------------
    # Core parameterizable task — moves an annotated tag to HEAD and force-pushes.
    # Usage:
    #   task tag:move -- TAG=stable
    #   task tag:move -- TAG=dev MSG="Development snapshot"
    tag:move:
        desc: >-
            Move an annotated git tag to HEAD and force-push it.  Pass
            `TAG=<name>` and optional `MSG=<message>`.
        vars:
            TAG: '{{.TAG | default "stable"}}'
            _HASH:
                sh: git -C {{._0}} rev-parse --short HEAD 2>/dev/null || echo ""
            _MSG: '{{.MSG | default (printf "%s @ %s" .TAG ._HASH)}}'
        preconditions:
            - sh: git -C {{._0}} rev-parse --git-dir > /dev/null 2>&1
              msg: Not inside a git repository.
        prompt: 'Move `{{.TAG}}` tag to HEAD and force-push to `{{.GIT_REMOTE}}`?'
        cmds:
            - cmd: >-
                git -C {{._0}} tag -f -a '{{.TAG}}' HEAD
                -m '{{._MSG}}'
            - cmd: git -C {{._0}} push '{{.GIT_REMOTE}}' '{{.TAG}}' --force

    # Convenience aliases for industry-standard moving tags.
    tag:stable:
        desc: Move the `stable` annotated tag to HEAD and force-push.
        cmds:
            - task: tag:move
              vars: {TAG: stable}

    tag:dev:
        desc: Move the `dev` annotated tag to HEAD and force-push.
        cmds:
            - task: tag:move
              vars: {TAG: dev}

    tag:latest:
        desc: Move the `latest` annotated tag to HEAD and force-push.
        cmds:
            - task: tag:move
              vars: {TAG: latest}

    tag:nightly:
        desc: Move the `nightly` annotated tag to HEAD and force-push.
        cmds:
            - task: tag:move
              vars: {TAG: nightly}

    tag:edge:
        desc: Move the `edge` annotated tag to HEAD and force-push.
        cmds:
            - task: tag:move
              vars: {TAG: edge}

    # -----------------
    # Permanent Tags
    # -----------------
    # Semver version tags — created once, never moved.
    # Usage:
    #   task tag:version -- VERSION=v1.0.0
    #   task tag:version -- VERSION=v1.0.0 MSG="Initial release"
    tag:version:
        desc: >-
            Create a permanent semver version tag at HEAD and push.  Requires
            `VERSION=<v1.0.0>`.  Optional `MSG=<message>`.
        vars:
            VERSION: '{{.VERSION | default ""}}'
            _MSG: '{{.MSG | default (printf "Release %s" .VERSION)}}'
        preconditions:
            - sh: git -C {{._0}} rev-parse --git-dir > /dev/null 2>&1
              msg: Not inside a git repository.
            - sh: '[[ "{{.VERSION}}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
              msg: 'VERSION must be a semver string like `v1.0.0` (pass with `VERSION=<v1.0.0>`).'
        prompt: 'Create version tag `{{.VERSION}}` at HEAD and push to `{{.GIT_REMOTE}}`?'
        cmds:
            - cmd: git -C {{._0}} tag -a '{{.VERSION}}' HEAD -m '{{._MSG}}'
            - cmd: git -C {{._0}} push '{{.GIT_REMOTE}}' '{{.VERSION}}'

    # Pre-release tags (rc, beta, alpha).
    # Usage:
    #   task tag:prerelease -- VERSION=v1.0.0-rc.1
    #   task tag:prerelease -- VERSION=v1.0.0-beta.3 MSG="Feature freeze"
    tag:prerelease:
        desc: >-
            Create a pre-release tag (rc/beta/alpha) at HEAD and push.  Requires
            `VERSION=<v1.0.0-rc.1>`.  Optional `MSG=<message>`.
        vars:
            VERSION: '{{.VERSION | default ""}}'
            _MSG: '{{.MSG | default (printf "Pre-release %s" .VERSION)}}'
        preconditions:
            - sh: git -C {{._0}} rev-parse --git-dir > /dev/null 2>&1
              msg: Not inside a git repository.
            - sh: '[[ "{{.VERSION}}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(rc|beta|alpha)\.?[0-9]*$ ]]'
              msg: 'VERSION must be a pre-release semver like `v1.0.0-rc.1`.'
        prompt: 'Create pre-release tag `{{.VERSION}}` at HEAD and push to `{{.GIT_REMOTE}}`?'
        cmds:
            - cmd: git -C {{._0}} tag -a '{{.VERSION}}' HEAD -m '{{._MSG}}'
            - cmd: git -C {{._0}} push '{{.GIT_REMOTE}}' '{{.VERSION}}'

    # -------------
    # Utilities
    # -------------
    tag:list:
        desc: List all git tags, sorted by version (newest first).
        cmd: git -C {{._0}} tag -l --sort=-v:refname

    tag:push:
        desc: Push all local tags to the remote.
        cmd: git -C {{._0}} push '{{.GIT_REMOTE}}' --tags

    tag:clean:
        desc: >-
            Prune local tags (and stale remote-tracking branches) that no longer
            exist on the remote.
        cmd: git -C {{._0}} fetch '{{.GIT_REMOTE}}' --prune --prune-tags

    agent:new:
        cmd: '{{.AWT}} new {{.CLI_ARGS}}'
        desc: 'Provision an isolated worktree+branch: `task agent:new -- MEMY-88 "short desc"`.'
        aliases: [wt:new]

    agent:list:
        cmd: '{{.AWT}} list'
        desc: List the live agent/* worktrees with ahead/dirty status.
        aliases: [wt:list, wt:ls]

    agent:merge:
        cmd: '{{.AWT}} merge {{.CLI_ARGS}}'
        desc: 'Land a reviewed branch into main and push by default: `task agent:merge -- agent/<branch>`.'
        aliases: [wt:merge, wt:land]

    agent:abandon:
        cmd: '{{.AWT}} abandon {{.CLI_ARGS}}'
        desc: 'Discard a rejected branch + its worktree: `task agent:abandon -- agent/<branch>`.'
        aliases: [wt:abandon]

    agent:gc:
        cmd: '{{.AWT}} gc'
        desc: Prune merged agent/* branches past the grace window.
        aliases: [wt:gc]

    sync:
        cmd: '{{.UV}} sync --all-extras {{.CLI_ARGS}}'
        aliases: [install, setup]
        desc: Install & verify dependencies through `uv sync`, including all optional and dev
            dependencies.

    # ----------
    # Evaluation
    # ----------
    eval:
        desc: Format the codebase (python, markdown, yaml, toml), then run static assessment.
        deps:
            - eval:format
        cmds:
            - task: eval:lint
            - task: eval:typecheck

    eval:lint:
        cmd: '{{.UV}} run ruff check {{.CLI_ARGS}}'
        desc: Catch logic & semantic errors with `ruff check`.
        aliases: [ch, ruff, check]

    eval:typecheck:
        cmd: '{{.UV}} run pyrefly check {{.CLI_ARGS}}'
        desc: Verify types and import structure with `pyrefly check`.
        aliases: [ty, types]

    eval:typecheck:matrix:
        desc: Typecheck against every supported interpreter (`3.pyver .. 3.pymax`). `pyrefly`'s
            configured `python-version` should be the FLOOR, so this adds the newer ones.
        aliases: [tym, types-matrix, typecheck-matrix]
        vars:
            PYVERS:
                sh: seq {{get .REPO "pyver"}} {{get .REPO "pymax" | default (get .REPO "pyver")}}
                    | sed 's/^/3./' | tr '\n' ' '
        cmd: |
            set -e
            for v in {{.PYVERS}}; do
              printf '\033[1m── pyrefly @ py%s ──\033[0m\n' "$v"
              {{.UV}} run pyrefly check . --python-version "$v" {{.CLI_ARGS}}
            done

    # Formatting — `eval:format` is the umbrella that runs every formatter in place.
    # Each leaf accepts `{{.CLI_ARGS}}` for targeted runs (e.g. `task eval:format:py -- f.py`);
    # with no args the leaves format the whole tree. Config lives in the per-project
    # `.mdformat.toml` / `.taplo.toml` / `.yamlfmt.yaml` (these tools do not read pyproject.toml).
    eval:format:
        desc: Format python, markdown, yaml, and toml in place.
        aliases: [fm, fmt, format]
        cmds:
            - task: eval:format:py
            - task: eval:format:md
            - task: eval:format:yaml
            - task: eval:format:toml

    eval:format:py:
        cmd: '{{.UV}} run ruff format {{.CLI_ARGS}}'
        desc: Format python in place with `ruff format`.
        aliases: [fmt:py, format:py]

    eval:format:md:
        desc: Format markdown in place with `mdformat` (reads `.mdformat.toml`); skipped if
            mdformat is not installed in the env.
        cmd: |
            if ! {{.UV}} run --quiet mdformat --version >/dev/null 2>&1; then
              echo "mdformat not installed in this env — skipping markdown formatting." >&2
            elif [ -n "{{.CLI_ARGS}}" ]; then
              {{.UV}} run mdformat {{.CLI_ARGS}}
            else
              {{.UV}} run mdformat .
            fi

    eval:format:yaml:
        desc: Format yaml in place with `yamlfmt` (reads `.yamlfmt.yaml`); skipped if yamlfmt is
            not on PATH (it is a Go binary, not pip-installable).
        cmd: |
            if ! command -v yamlfmt >/dev/null 2>&1; then
              echo "yamlfmt not found on PATH — skipping yaml formatting." >&2
            elif [ -n "{{.CLI_ARGS}}" ]; then
              yamlfmt {{.CLI_ARGS}}
            else
              yamlfmt
            fi

    eval:format:toml:
        desc: Format toml in place with `taplo format` (reads `.taplo.toml`); skipped if taplo is
            not installed in the env.
        cmd: |
            unset TAPLO_CONFIG 2>/dev/null || true
            if ! {{.UV}} run --quiet taplo --version >/dev/null 2>&1; then
              echo "taplo not installed in this env — skipping toml formatting." >&2
            elif [ -n "{{.CLI_ARGS}}" ]; then
              {{.UV}} run taplo format {{.CLI_ARGS}}
            else
              {{.UV}} run taplo format '**/*.toml'
            fi

    # ----------
    # Pre-commit
    # ----------
    # The fast, high-frequency per-commit gate: format then lint STAGED FILES ONLY, fail-fast.
    # `eval` is the whole-tree CI/manual analogue; pyrefly and pytest stay out of the per-commit
    # path. Wire the git hook (prek.toml / .pre-commit-config.yaml) to a single thin `local` hook
    # that runs `task precommit` with `pass_filenames: false` — this task does its own git-diff
    # scoping so the hook stays declarative and tool versions live in uv.lock, not the hook config.
    precommit:
        desc: Fast per-commit gate — format + lint staged files only.
        aliases: [pre-commit, quick]
        cmds:
            - task: precommit:format
            - task: precommit:lint

    precommit:format:
        desc: Format staged python, markdown, yaml, and toml files.
        cmd: |
            set -e
            unset TAPLO_CONFIG 2>/dev/null || true
            git diff -z --diff-filter=d --cached --name-only -- '*.py' \
              | xargs -0 -r {{.UV}} run ruff format
            if {{.UV}} run --quiet mdformat --version >/dev/null 2>&1; then
              git diff -z --diff-filter=d --cached --name-only -- '*.md' \
                | xargs -0 -r {{.UV}} run mdformat
            fi
            if {{.UV}} run --quiet taplo --version >/dev/null 2>&1; then
              git diff -z --diff-filter=d --cached --name-only -- '*.toml' \
                | xargs -0 -r {{.UV}} run taplo format
            fi
            if command -v yamlfmt >/dev/null 2>&1; then
              git diff -z --diff-filter=d --cached --name-only -- '*.yaml' '*.yml' \
                | xargs -0 -r yamlfmt
            fi

    precommit:lint:
        desc: Lint staged python files with `ruff check --fix`.
        cmd: |
            set -e
            git diff -z --diff-filter=d --cached --name-only -- '*.py' \
              | xargs -0 -r {{.UV}} run ruff check --fix

    # -------
    # Testing
    # -------
    test:
        cmd: '{{.UV}} run pytest {{.CLI_ARGS}}'
        aliases: [pt, tests, pytest]
        desc: Dynamically assess the codebase by running `pytest` with no filters applied.

    test:dev:
        cmd: '{{.UV}} run pytest --sw -vv {{.CLI_ARGS}}'
        aliases: [dev-test]
        desc: Run iterative developer tests that stop upon first failure, showing extra output
            and skipping code coverage.

    test:pdb:
        cmd: '{{.UV}} run pytest -s --pdb --sw -vv {{.CLI_ARGS}}'
        aliases: [pdb-test, debug-test]
        desc: The same as dev-test, but also drop into the interactive debugger upon exception
            or failure.

    test:ssu:
        cmd: '{{.UV}} run pytest --snapshot-update {{.CLI_ARGS}}'
        aliases: [snapshot-test, ssu-test, snap-test]
        desc: Update regression test "snapshot" files to reflect the new truth.

    test:cov:
        cmd: >-
            {{.UV}} run pytest --cov "{{._PACKAGE | default ._PACKAGE_DEFAULT}}" --cov-branch
            --no-cov-on-fail {{.CLI_ARGS}}
            --cov-report term-missing --cov-report markdown:tests/coverage.md

        aliases: [coverage, cov-test, coverage-test]
        desc: Report code coverage of our unit tests to stdout and `tests/coverage.md`.

    test:matrix:
        desc: Run the suite on every supported interpreter (`3.pyver .. 3.pymax`).
        aliases: [matrix, matrix-test, test-matrix]
        cmd: |
            set -e
            for v in {{.PYVERS}}; do
              printf '\033[1m── py%s ──────────────────────────────\033[0m\n' "$v"
              UV_PROJECT_ENVIRONMENT={{._0}}/.venvs/py$v \
                {{.UV}} run --python "$v" --all-extras pytest -q {{.CLI_ARGS}}
            done

    test:floor:
        desc: Verify the declared dependency floors actually resolve and pass on the oldest
            supported interpreter -- catches `requires-python` drifting away from the pins.
        aliases: [floor, floor-test, test-floor]
        vars:
            PYMIN: '3.{{get .REPO "pyver"}}'
        cmd: |
            set -e
            export UV_PROJECT_ENVIRONMENT={{._0}}/.venvs/floor
            {{.UV}} sync --python '{{.PYMIN}}' --all-extras --resolution lowest-direct
            {{.UV}} run --python '{{.PYMIN}}' pytest -q {{.CLI_ARGS}}

    # -------------
    # Documentation
    # -------------
    docs:
        desc: Run the full documentation pipeline.
        aliases: [sphinx]
        cmds:
            - task: docs:sync
            - task: docs:build

    docs:sync:
        desc: Update generated docs from source code.
        aliases: [sync-docs, sphinx-sync]
        cmd: '{{.UV}} run sync-docs {{.CLI_ARGS}}'
        sources: ['{{.SRC_DIR}}/**/*.py']
        generates: ['{{.DOC_DIR}}/*.md']

    docs:build:
        desc: Build the MyST docs into finalized webpages.
        aliases: [build-docs]
        cmd: >-
            {{.UV}} run sphinx-build --fail-on-warning --nitpicky {{.CLI_ARGS}}
            {{.DOC_DIR}} {{.DOC_OUT}}
        sources:
            - '{{.DOC_DIR}}/**/*.md'
            - '{{.DOC_DIR}}/conf.py'
        generates: ['{{.DOC_OUT}}/*']

    docs:clean:
        desc: Remove all generated documentation files.
        aliases: [clean-docs, sphinx-clean]
        cmd: rm -rf {{.DOC_OUT}}/*

    docs:publish:
        desc: Publish finalized Sphinx artifacts to ReadTheDocs.
        aliases: [publish-docs, readthedocs]
        cmd: echo "docs:publish not yet implemented..."
        preconditions: ['false']

    # ---------------
    # Container Image
    # ---------------
    pod:build:
        cmd: '{{.OP}} build -t {{.IMG}} -f {{.IMG_FILE}} {{._0}}'
        desc: Build the container image.
        sources:
            - '{{._0}}/{{.IMG_FILE}}'
            - '{{._0}}/.repo.yaml'
        generates:
            - '{{.OP}} image inspect {{.IMG}}'
        preconditions:
            - sh: stat {{._0}}/{{.IMG_FILE}}
              msg: Containerfile not found in `{{.IMG_FILE}}`.
            - sh: stat {{._0}}/.repo.yaml
              msg: Repo data not found in `.repo.yaml`

    pod:test:
        cmd: >-
            {{.OP}} run --rm -v {{._0}}:/workspace:ro {{.IMG}} run pytest {{.CLI_ARGS}}
        desc: Run the test suite inside the container locally (mirrors the CI job).
        deps: ['pod:build']

    pod:push:
        cmd: '{{.OP}} push {{.IMG}}'
        desc: Push the built image to the GitLab Container Registry.

    # --------------
    # PyPI Packaging
    # --------------
    pkg:build:
        cmd: '{{.UV}} build --no-sources --wheel {{.CLI_ARGS}}'
        desc: Build a distributable wheel of this package through `uv build`.

    pkg:publish:
        cmd: '{{.UV}} publish {{.CLI_ARGS}}'
        desc: >-
            Break-glass local upload to PyPI with a long-lived PYPI_TOKEN. The
            PRIMARY path is the tag-triggered CI publish job (trusted publishing /
            OIDC, no stored token) -- use this only when CI is unavailable.
        env:
            UV_PUBLISH_TOKEN: '{{.PYPI_TOKEN}}'
        preconditions:
            - sh: '[[ -n $PYPI_TOKEN ]]'
              msg: PYPI_TOKEN environment variable is not set.

    pkg:publish:check:
        cmd: '{{.UV}} publish --dry-run {{.CLI_ARGS}}'
        desc: Validate the distribution without uploading (dry run).

    pkg:publish:test:
        cmd: >-
            {{.UV}} publish --publish-url https://test.pypi.org/legacy/ {{.CLI_ARGS}}
        desc: Upload to TestPyPI for verification before a real release.
        env:
            UV_PUBLISH_TOKEN: '{{.PYPI_TEST_TOKEN}}'
        preconditions:
            - sh: '[[ -n $PYPI_TEST_TOKEN ]]'
              msg: PYPI_TEST_TOKEN environment variable is not set.

    pkg:release:
        desc: >-
            Prepare a release: bump the version and validate the build, but do NOT
            upload. Publication is the tag-triggered CI job (Publish PyPI) --
            commit the bump, then tag `v<version>` and push the tag to trigger it.
            Override BUMP= to control the increment (major, minor, patch).
        cmds:
            - cmd: '{{.UV}} version --bump {{.BUMP | default "patch"}}'
            - task: pkg:build
            - task: pkg:publish:check
            - cmd: |
                V=$({{.UV}} version --short)
                echo ""
                echo "Version bumped to $V and build validated (dry-run OK)."
                echo "Publish happens in CI on the tag. Next:"
                echo "  git commit -am \"chore: release v$V\""
                echo "  git tag v$V && git push origin v$V"
                echo "(Break-glass local upload: task pkg:publish)"

    pkg:release:patch:
        desc: Release a new patch version (e.g. 1.2.3 → 1.2.4).
        vars:
            BUMP: 'patch'
        cmds:
            - task: pkg:release

    pkg:release:minor:
        desc: Release a new minor version (e.g. 1.2.3 → 1.3.0).
        vars:
            BUMP: 'minor'
        cmds:
            - task: pkg:release

    pkg:release:major:
        desc: Release a new major version (e.g. 1.2.3 → 2.0.0).
        vars:
            BUMP: 'major'
        cmds:
            - task: pkg:release
